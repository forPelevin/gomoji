version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - nakedret
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - atomicalign
        - printf
    nakedret:
      max-func-lines: 30
    revive:
      rules:
        - name: early-return
        - name: unused-parameter

formatters:
  enable:
    - gofmt
    - goimports
