# data.go is generated from the Unicode emoji-test.txt data set. Its emoji
# literals contain ZWJ (U+200D) and other format characters by design, so
# ST1018 fires hundreds of times there and buries every real finding.
#
# golangci-lint, which gates CI, already skips the file via its
# "Code generated ... DO NOT EDIT." header. This keeps a bare
# `staticcheck ./...` usable for contributors too.
checks = ["all", "-ST1018"]
